<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil · Verde Real</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/feed.css">
</head>
<body class="pagina-feed" onload="hidePreloader()">

    <header class="flex">
        <div class="logo-box flex">
            <h1><i class="fa-solid fa-seedling" style="color: var(--verde-primario);"></i> Verde Real</h1>
        </div>
        <div class="header-acoes flex">
            <button type="button" class="vr-menu-toggle" id="vrMenuToggle"
                    aria-label="Abrir menu" aria-expanded="false" aria-controls="vrMenuPanel">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
        </div>
        <nav class="nav-links flex" id="vrMenuPanel">
            <a href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Voltar</a>
            <a href="index.html">Início</a>
            <a href="selo.html">Selo Verde</a>
            <a href="sobre.html">Sobre nós</a>
            <a href="login.html" class="btn-login" id="logoutBtn">Sair</a>
        </nav>
    </header>

    <div class="feed-wrapper feed-wrapper--sem-rail">
        <div class="feed-central">
            <div id="meu-perfil-container">
                <div class="mensagem-feed">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Carregando seu perfil...</h3>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-card">
                <h3><i class="fas fa-user-cog"></i> Minha conta</h3>
                <ul class="conta-lista">
                    <li class="conta-lista-item desabilitado">
                        <i class="fas fa-cog"></i> Configurações
                        <span class="em-breve">em breve</span>
                    </li>
                    <li class="conta-lista-item desabilitado">
                        <i class="fas fa-lock"></i> Alterar senha
                        <span class="em-breve">em breve</span>
                    </li>
                    <li class="conta-lista-item sair" id="btnSairConta">
                        <i class="fas fa-sign-out-alt"></i> Sair da conta
                    </li>
                </ul>
            </div>
        </aside>
    </div>

    <input type="file" id="inputAvatar" accept="image/*" style="display:none;">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/verde-real/verde-real-core@main/dist/index.global.js"></script>
    <script src="../js/supabase/auth-supabase.js"></script>
    <script src="../js/supabase/feed-supabase.js"></script>
    <script src="../js/post-card.js"></script>
    <script src="../js/supabase/meu-perfil.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/supabase/main-supabase.js"></script>
    <script src="../js/supabase/notificacoes-supabase.js"></script>
    <script src="../js/notificacoes.js"></script>
    <script src="../js/avatar-header.js"></script>
    <script src="../js/menu-header.js"></script>
    <script src="../js/atalhos-ui.js"></script>
</body>
</html>
